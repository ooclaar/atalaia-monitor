<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atalaia · Health Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-window">
    <!-- Cabeçalho Principal -->
    <div class="dashboard-header">
      <div class="header-left">
        <h1>Monitores</h1>
        <p class="header-subtitle" id="headerSubtitle">
          <span class="dot online"></span> 10 endpoints · última varredura há 3 segundos · próxima em 27s
        </p>
      </div>
      <div class="header-right">
        <input type="text" class="search-box" id="searchBox" placeholder="Buscar host, IP ou porta">
      </div>
    </div>

    <!-- Barra de Ferramentas -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn btn-primary" id="openAddModal">
          <span class="btn-icon">+</span> Novo monitor
        </button>
        <button class="btn" id="testAllBtn">
          <span class="btn-icon">🔄</span> Verificar agora
        </button>
        <button class="btn" id="pauseAllBtn">
          <span class="btn-icon">⏸</span> Pausar todos
        </button>
        <div class="separator"></div>
        <div class="filter-container">
          <button class="btn" id="filterBtn">
            <span class="btn-icon">⊙</span> Filtrar <span class="filter-badge" id="filterBadge" style="display: none;">2</span>
          </button>
          <div class="filter-menu" id="filterMenu" style="display: none;">
            <label><input type="checkbox" id="filterOnline"> Online</label>
            <label><input type="checkbox" id="filterOffline"> Offline</label>
            <label><input type="checkbox" id="filterSlow"> Lento</label>
          </div>
        </div>
        <button class="btn" id="exportBtn">
          <span class="btn-icon">⬇</span> Exportar
        </button>
      </div>
      <div class="toolbar-right">
        <button class="btn" id="themeToggleBtn" title="Alternar modo escuro">
          <span class="btn-icon">🌙</span>
        </button>
        <div class="view-toggle">
          <button class="view-btn active" data-view="table">Tabela</button>
          <button class="view-btn" data-view="cards">Cards</button>
          <button class="view-btn" data-view="compact">Compacto</button>
        </div>
      </div>
    </div>

    <!-- Cards de Status -->
    <div class="status-cards">
      <div class="status-card">
        <div class="status-card-dot online"></div>
        <div class="status-card-content">
          <div class="status-card-label">ONLINE</div>
          <div class="status-card-value" id="cardOnline">8</div>
        </div>
      </div>
      <div class="status-card">
        <div class="status-card-dot slow"></div>
        <div class="status-card-content">
          <div class="status-card-label">LENTO</div>
          <div class="status-card-value" id="cardSlow">1</div>
        </div>
      </div>
      <div class="status-card">
        <div class="status-card-dot offline"></div>
        <div class="status-card-content">
          <div class="status-card-label">OFFLINE</div>
          <div class="status-card-value" id="cardOffline">1</div>
        </div>
      </div>
      <div class="status-card">
        <div class="status-card-label-only">LAT. MÉDIA</div>
        <div class="status-card-value" id="cardLatency">17 ms</div>
      </div>
      <div class="status-card">
        <div class="status-card-label-only">UPTIME 24H</div>
        <div class="status-card-value" id="cardUptime">99,82%</div>
      </div>
    </div>

    <!-- Conteúdo Dinâmico (Tabela/Cards/Compacto) -->
    <div class="content-area">
      <!-- Visualização em Tabela -->
      <div class="table-container" id="tableView">
        <table class="monitors-table">
          <thead>
            <tr>
              <th>NOME</th>
              <th>ENDEREÇO</th>
              <th>PORTA</th>
              <th>LATÊNCIA</th>
              <th>TENDÊNCIA (60MIN)</th>
              <th>UPTIME 24H</th>
              <th>ÚLTIMA VERIFICAÇÃO</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="monitorsList">
            <!-- Renderizado via JS -->
          </tbody>
        </table>
      </div>

      <!-- Visualização em Cards -->
      <div class="cards-container" id="cardsView" style="display: none;">
        <div id="monitorCardsGrid">
          <!-- Renderizado via JS -->
        </div>
      </div>

      <!-- Visualização Compacta -->
      <div class="compact-container" id="compactView" style="display: none;">
        <div id="monitorCompactList">
          <!-- Renderizado via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Adicionar Monitor -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Novo Monitor</h2>
        <button class="modal-close" id="closeAddModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Nome do Host</label>
          <input type="text" id="nameInput" placeholder="Ex: Servidor Produção">
        </div>
        <div class="form-group">
          <label>Endereço IP / Hostname</label>
          <input type="text" id="ipInput" placeholder="Ex: 192.168.1.1">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Tipo de Teste</label>
            <select id="typeSelect">
              <option value="port">Porta TCP</option>
              <option value="ping">Ping (ICMP)</option>
            </select>
          </div>
          <div class="form-group" id="portFieldContainer">
            <label>Porta</label>
            <input type="number" id="portInput" placeholder="Ex: 80" min="1" max="65535">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="cancelAddBtn">Cancelar</button>
        <button class="btn btn-primary" id="addBtn">Adicionar</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
